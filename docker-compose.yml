
version: "3.8"

services:
  # MySQL – само ако користиш локална база во Docker (раскоментирај depends_on во backend)
  mysql:
    image: mysql:8.0
    restart: unless-stopped   # pri pad na azure serverot vedna po podiganje ke se vkluce database
    # Root лозинка: само од backend/.env (MYSQL_ROOT_PASSWORD — исто како DB_PASSWORD).
    # НЕ користи MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} тука: ако коренот нема .env, Compose ја
    # заменува со празно и го презапишува env_file → 1045 при логирање.
    env_file:
      - ./backend/.env
    environment:
      MYSQL_DATABASE: ${DB_NAME:-Klinicka_Bolnica_Stip}
    ports:
      - "3306:3306"     # porta na slusanje edna za ured, eden za docker
    volumes:
      - mysql_data:/var/lib/mysql   # povrzuvanje na podatocite od bazata so azure diskovite
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci # utf-8 oddeli lekari i makedonski tekst
    healthcheck: # mysqladmin ping
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    # (без profiles: постари Docker/Compose на VM не поддржуваат --profile; MySQL се стартува со `docker compose up -d`)
    # Ако користиш само Azure MySQL: не пуштај го mysql сервисот — на пр. `docker compose up -d backend frontend` или скриј го mysql со override.

  # Backend (FastAPI) – сервира и API и статички frontend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Само backend/.env — НЕ додавај DB_* во environment со ${...}: празниот корен .env
    # ги презапишува лозинката/хостот и backend добива 500 при конекција кон MySQL.
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/static:/app/static
    # Ако backend се поврзува на контејнер mysql, раскоментирај:
    # depends_on:
    #   mysql:
    #     condition: service_healthy

  # Frontend se postavuva na porta 80
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro # static frontend
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro    # ja vcituva konfiguracijata, kako se odvivaat baranjata
    depends_on:
      - backend       # frontend ne se aktivira dodeka ne se startuva backend, se ceka start na backend pa potoa na frontend

volumes:
  mysql_data:
