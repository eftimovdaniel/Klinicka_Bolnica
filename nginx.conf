server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Поставки за пријави/слики од админ (новости)
    client_max_body_size 50M;

    # FastAPI преку backend: regex location мора да фати /lekari пред „location /“ (иначе се враќа index.html наместо JSON)
    location ~ ^/(lekari|pacienti|termini|admin|aparati|specialnosti|uslugi|novosti|kariera|aplikacija|static|docs|openapi\.json|redoc|debug-novosti|debug-kariera|debug-db)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
